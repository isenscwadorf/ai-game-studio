[package]
name = "ai-game-studio-creator"
version = "0.1.0"
description = "AI Game Studio Creator desktop application"
edition = "2021"

[lib]
name = "ai_game_studio_creator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ai-game-studio-creator"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.1", features = [] }
tauri-plugin-dialog = "=2.7.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.24.0"
getrandom = "=0.3.4"
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
