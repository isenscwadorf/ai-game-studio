name: Creator Validation

on:
  pull_request:
  push:
    branches:
      - main
      - isenscwadorf/creator-mvp-slice-2-runtime-red

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/creator/package-lock.json
      - run: npm ci
        working-directory: apps/creator
      - run: npm run verify
        working-directory: apps/creator

  runtime-godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download pinned Godot 4.7.2
        run: |
          curl -fL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
      - name: Verify Godot version
        run: python tools/runtime/verify_godot_version.py .godot-bin/Godot_v4.7.2-stable_linux.x86_64
      - name: Project loader tests
        run: .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path apps/runtime-godot --script res://tests/test_project_loader.gd
      - name: Bridge protocol tests
        run: .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path apps/runtime-godot --script res://tests/test_bridge_protocol.gd
      - name: Dialogue runtime tests
        run: .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path apps/runtime-godot --script res://tests/test_dialogue_runtime.gd
      - name: VN stage state tests
        run: .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path apps/runtime-godot --script res://tests/test_stage_state.gd

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/creator/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: clippy
      - run: npm ci
        working-directory: apps/creator
      - run: cargo test --manifest-path apps/creator/src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path apps/creator/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: npm run tauri -- build --no-bundle
        working-directory: apps/creator
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDirectory = 'dist/creator-foundation'
          $executable = 'apps/creator/src-tauri/target/release/ai-game-studio-creator.exe'
          $archive = 'dist/AI-Game-Studio-Creator-Foundation-windows-x64.zip'

          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Expected Creator executable was not produced: $executable"
          }

          New-Item -ItemType Directory -Force $packageDirectory | Out-Null
          Copy-Item -LiteralPath $executable -Destination "$packageDirectory/AI Game Studio.exe"
          Copy-Item -LiteralPath 'apps/creator/README.md' -Destination "$packageDirectory/README.md"
          Compress-Archive -Path "$packageDirectory/*" -DestinationPath $archive -Force
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AI-Game-Studio-Creator-Foundation-windows-x64
          path: dist/AI-Game-Studio-Creator-Foundation-windows-x64.zip
          if-no-files-found: error
