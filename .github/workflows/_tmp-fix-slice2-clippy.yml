name: Temporary Slice 2 Clippy Fix

on:
  push:
    branches:
      - isenscwadorf/creator-mvp-slice-2-implementation

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: isenscwadorf/creator-mvp-slice-2-implementation
      - name: Remove unused MIME binding
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/creator/src-tauri/src/asset_import.rs')
          text = path.read_text(encoding='utf-8')
          old = '    let (extension, mime_type) = classify_image_extension(source)?;'
          new = '    let (extension, _) = classify_image_extension(source)?;'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one Clippy target, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/creator/src-tauri/src/asset_import.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(creator): clear asset import clippy warning"
          git push origin HEAD:isenscwadorf/creator-mvp-slice-2-implementation
