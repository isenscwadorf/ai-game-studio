name: Temporary Slice 2 Schema Sync

on:
  push:
    branches:
      - isenscwadorf/creator-mvp-slice-2-implementation

permissions:
  contents: write

jobs:
  sync-generated-schemas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: isenscwadorf/creator-mvp-slice-2-implementation
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/creator/package-lock.json
      - name: Install Creator dependencies
        working-directory: apps/creator
        run: npm ci
      - name: Regenerate schema artifacts
        working-directory: apps/creator
        run: npm run generate:schemas
      - name: Commit generated schema artifacts
        shell: bash
        run: |
          if git diff --quiet -- apps/creator/src/generated/schemaCatalog.ts apps/creator/src/generated/schemaValidators.ts; then
            echo "Generated schema artifacts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/creator/src/generated/schemaCatalog.ts apps/creator/src/generated/schemaValidators.ts
          git commit -m "chore(schema): refresh generated Creator validators"
          git push origin HEAD:isenscwadorf/creator-mvp-slice-2-implementation
